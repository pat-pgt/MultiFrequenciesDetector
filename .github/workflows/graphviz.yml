name: Graphviz documentation CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: environement
      run: |
        sudo apt-get install -y graphviz
        sudo apt-get install -y ghostscript
    - name: setup folders
      run: |
        mkdir build
        mkdir build/pdf
        mkdir build/jpeg
        mkdir build/png
        mkdir build/ps
    - name: building
      run: |
        cd Documentation
        make DOTLANG=pdf BUILDDIR=../build/pdf/
        make DOTLANG=jpeg BUILDDIR=../build/jpeg/
        make DOTLANG=png BUILDDIR=../build/png/
        make DOTLANG=ps BUILDDIR=../build/ps/
    - name: return workflow as artifacts
      uses: actions/upload-artifact@v6
      with:
        name: MultiFrequenciesDetector-doc
        path: build/*
